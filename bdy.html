<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday 🎂</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        h1 {
            font-size: 55px;
            color: white;
            text-shadow: 3px 3px 10px #ff4081;
            animation: zoom 1.5s infinite alternate;
        }

        h2 {
            margin-top: 15px;
            color: white;
            font-size: 28px;
        }

        .cake {
            position: relative;
            margin-top: 50px;
            width: 180px;
            height: 100px;
            background: #8b4513;
            border-radius: 10px;
            box-shadow: 0 8px 0 #5c2d0c;
        }

        .cake::before {
            content: "";
            position: absolute;
            width: 200px;
            height: 35px;
            background: #ff69b4;
            top: -25px;
            left: -10px;
            border-radius: 15px;
        }

        .candle {
            position: absolute;
            width: 12px;
            height: 55px;
            background: white;
            top: -75px;
            left: 84px;
        }

        .flame {
            position: absolute;
            width: 20px;
            height: 25px;
            background: orange;
            border-radius: 50%;
            top: -25px;
            left: -4px;
            animation: flame 0.5s infinite alternate;
        }

        .balloon {
            position: absolute;
            width: 70px;
            height: 85px;
            border-radius: 50%;
            animation: float 4s infinite ease-in-out;
        }

        .b1 {
            left: 8%;
            top: 20%;
            background: #ff4081;
        }

        .b2 {
            right: 8%;
            top: 30%;
            background: #7c4dff;
            animation-delay: 1s;
        }

        .b3 {
            left: 18%;
            bottom: 15%;
            background: #00bcd4;
            animation-delay: 2s;
        }

        .b4 {
            right: 18%;
            bottom: 12%;
            background: #ff9800;
            animation-delay: 1.5s;
        }

        .string {
            width: 2px;
            height: 100px;
            background: white;
            margin: auto;
        }

        .heart {
            position: absolute;
            color: #ff1744;
            font-size: 35px;
            animation: fall 5s linear infinite;
        }

        @keyframes zoom {
            from {
                transform: scale(1);
            }
            to {
                transform: scale(1.1);
            }
        }

        @keyframes flame {
            from {
                transform: scale(1);
            }
            to {
                transform: scale(1.3);
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-40px);
            }
        }

        @keyframes fall {
            from {
                transform: translateY(-100px) rotate(0deg);
            }
            to {
                transform: translateY(100vh) rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div class="balloon b1">
        <div class="string"></div>
    </div>

    <div class="balloon b2">
        <div class="string"></div>
    </div>

    <div class="balloon b3">
        <div class="string"></div>
    </div>

    <div class="balloon b4">
        <div class="string"></div>
    </div>

    <div class="container">

        <h1>🎉 Happy Birthday 🎉</h1>

        <h2>💖 Have a Beautiful Day 💖</h2>

        <div class="cake">
            <div class="candle">
                <div class="flame"></div>
            </div>
        </div>

    </div>

    <script>
        function createHeart() {
            const heart = document.createElement("div");

            heart.className = "heart";
            heart.innerHTML = "❤️";

            heart.style.left = Math.random() * 100 + "vw";
            heart.style.animationDuration =
                (Math.random() * 3 + 3) + "s";

            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 6000);
        }

        setInterval(createHeart, 300);
    </script>

</body>
</html>
